<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1440 750"><title id="title">HARP · overall reconstruction pipeline</title><desc id="desc">A small predictor estimates reconstruction controls; the renderer determines how they become speech.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c76530"/></marker><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78648c"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" fill="#1f2937"><text x="20" y="33" font-size="27" font-weight="700">HARP · overall reconstruction pipeline</text><text x="20" y="61" font-size="16" fill="#64748b">A small predictor estimates reconstruction controls; the renderer determines how they become speech.</text><polyline points="155,232 205,232" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="335,232 355,232 355,300 385,300" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="480,265 480,160" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="575,125 625,125" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="835,125 885,125" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="987,160 987,265" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="575,300 885,300" fill="none" stroke="#2563eb" stroke-width="1.8"  marker-end="url(#a1)"/><polyline points="835,395 865,395 865,330 885,330" fill="none" stroke="#c76530" stroke-width="1.8"  marker-end="url(#a2)"/><polyline points="1090,307 1150,307" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="1205,307 1245,307" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="270,265 270,445 1177,445 1177,335" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="270,265 270,495 1332,495 1332,455" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a3)"/><polyline points="1332,395 1332,350" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a3)"/><polyline points="310,642 430,642" fill="none" stroke="#78648c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a4)"/><polyline points="800,642 920,642" fill="none" stroke="#78648c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a4)"/><rect x="25" y="200" width="130" height="65" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="90" y="226.5" text-anchor="middle" font-size="18"><tspan x="90" dy="0">Band-limited</tspan><tspan x="90" dy="24">LR waveform</tspan></text><rect x="205" y="200" width="130" height="65" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="270" y="226.5" text-anchor="middle" font-size="18"><tspan x="270" dy="0">STFT</tspan><tspan x="270" dy="24">magnitude + phase</tspan></text><rect x="385" y="90" width="190" height="70" rx="9" fill="#fff2cc" stroke="#475569" stroke-width="1.5"/><text x="480" y="119" text-anchor="middle" font-size="18"><tspan x="480" dy="0">Mixed-carrier features</tspan><tspan x="480" dy="24">257 STFT → 128 ERB</tspan></text><rect x="625" y="90" width="210" height="70" rx="9" fill="#e4dfec" stroke="#475569" stroke-width="1.5"/><text x="730" y="119" text-anchor="middle" font-size="18"><tspan x="730" dy="0">Compact predictor</tspan><tspan x="730" dy="24">4 causal Conv + 2 GRU</tspan></text><rect x="885" y="90" width="205" height="70" rx="9" fill="#e4dfec" stroke="#475569" stroke-width="1.5"/><text x="987.5" y="119" text-anchor="middle" font-size="18"><tspan x="987.5" dy="0">Two WGMM heads</tspan><tspan x="987.5" dy="24">weights · spreads · gains</tspan></text><rect x="385" y="265" width="190" height="70" rx="9" fill="#dae8fc" stroke="#475569" stroke-width="1.5"/><text x="480" y="294" text-anchor="middle" font-size="18"><tspan x="480" dy="0">Mixed magnitude carrier</tspan><tspan x="480" dy="24">LR + rectified-LR path</tspan></text><rect x="625" y="365" width="210" height="60" rx="9" fill="#fce4d6" stroke="#475569" stroke-width="1.5"/><text x="730" y="389" text-anchor="middle" font-size="18"><tspan x="730" dy="0">Flat aperiodic carrier</tspan><tspan x="730" dy="24">W = exp(−1)</tspan></text><rect x="885" y="265" width="205" height="85" rx="9" fill="#fce4d6" stroke="#475569" stroke-width="1.5"/><text x="987.5" y="289.5" text-anchor="middle" font-size="18"><tspan x="987.5" dy="0">Dual-branch renderer</tspan><tspan x="987.5" dy="24">Periodic + aperiodic</tspan><tspan x="987.5" dy="24">LAEA on aperiodic only</tspan></text><ellipse cx="1177.5" cy="307.5" rx="27.5" ry="27.5" fill="#e2f0d9" stroke="#475569" stroke-width="1.5"/><text x="1177.5" y="313.5" text-anchor="middle" font-size="30"><tspan x="1177.5" dy="0">+</tspan></text><rect x="1245" y="265" width="175" height="85" rx="9" fill="#e2f0d9" stroke="#475569" stroke-width="1.5"/><text x="1332.5" y="289.5" text-anchor="middle" font-size="18"><tspan x="1332.5" dy="0">Waveform synthesis</tspan><tspan x="1332.5" dy="24">iSTFT</tspan><tspan x="1332.5" dy="24">reconstructed speech</tspan></text><rect x="1245" y="395" width="175" height="60" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="1332.5" y="419" text-anchor="middle" font-size="18"><tspan x="1332.5" dy="0">Phase-flipped</tspan><tspan x="1332.5" dy="24">LR phase</tspan></text><text x="735" y="493.5" text-anchor="middle" font-size="17"><tspan x="735" dy="0">Observed LR magnitude is retained in the final magnitude sum.</tspan></text><text x="720" y="576" text-anchor="middle" font-size="17"><tspan x="720" dy="0">ANALYSIS ONLY · not a deployment input or a source of training supervision</tspan></text><rect x="80" y="610" width="230" height="65" rx="9" fill="#f4f1f7" stroke="#475569" stroke-width="1.5"/><text x="195" y="636.5" text-anchor="middle" font-size="18"><tspan x="195" dy="0">Paired LR / HR targets</tspan><tspan x="195" dy="24">HF residual</tspan></text><rect x="430" y="610" width="370" height="65" rx="9" fill="#f4f1f7" stroke="#475569" stroke-width="1.5"/><text x="615" y="636.5" text-anchor="middle" font-size="18"><tspan x="615" dy="0">HR-informed EM-style fitting</tspan><tspan x="615" dy="24">Related fixed-centre dual-carrier family</tspan></text><rect x="920" y="610" width="370" height="65" rx="9" fill="#f4f1f7" stroke="#475569" stroke-width="1.5"/><text x="1105" y="636.5" text-anchor="middle" font-size="18"><tspan x="1105" dy="0">Target-side representational reference</tspan><tspan x="1105" dy="24">LSD 0.65; not a deployable condition</tspan></text></g></svg>