<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1440 710"><title id="title">HARP · inside the dual-branch renderer</title><desc id="desc">The branch roles are designed reconstruction contributions, not identified physical sources.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78648c"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c76530"/></marker><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" fill="#1f2937"><text x="20" y="33" font-size="27" font-weight="700">HARP · inside the dual-branch renderer</text><text x="20" y="61" font-size="16" fill="#64748b">The branch roles are designed reconstruction contributions, not identified physical sources.</text><polyline points="240,210 660,210" fill="none" stroke="#2563eb" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="472,145 472,165 782,165 782,175" fill="none" stroke="#78648c" stroke-width="1.8"  marker-end="url(#a1)"/><polyline points="240,380 345,380" fill="none" stroke="#c76530" stroke-width="1.8"  marker-end="url(#a2)"/><polyline points="472,455 472,415" fill="none" stroke="#78648c" stroke-width="1.8"  marker-end="url(#a1)"/><polyline points="600,380 660,380" fill="none" stroke="#c76530" stroke-width="1.8"  marker-end="url(#a2)"/><polyline points="782,455 782,415" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a3)"/><polyline points="905,210 1080,210 1080,270" fill="none" stroke="#2563eb" stroke-width="1.8"  marker-end="url(#a0)"/><polyline points="905,380 1080,380 1080,330" fill="none" stroke="#c76530" stroke-width="1.8"  marker-end="url(#a2)"/><polyline points="1090,145 1150,145 1150,235 1080,235 1080,270" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a4)"/><polyline points="1110,300 1180,300" fill="none" stroke="#334155" stroke-width="1.8"  marker-end="url(#a4)"/><rect x="35" y="175" width="205" height="70" rx="9" fill="#dae8fc" stroke="#475569" stroke-width="1.5"/><text x="137.5" y="204" text-anchor="middle" font-size="18"><tspan x="137.5" dy="0">Mixed carrier Bv</tspan><tspan x="137.5" dy="24">Harmonic support</tspan></text><rect x="345" y="75" width="255" height="70" rx="9" fill="#e4dfec" stroke="#475569" stroke-width="1.5"/><text x="472.5" y="104" text-anchor="middle" font-size="18"><tspan x="472.5" dy="0">Periodic WGMM + frame gain</tspan><tspan x="472.5" dy="24">Ev(f,t) and Gv(t)</tspan></text><rect x="660" y="175" width="245" height="70" rx="9" fill="#dae8fc" stroke="#475569" stroke-width="1.5"/><text x="782.5" y="204" text-anchor="middle" font-size="18"><tspan x="782.5" dy="0">Periodic contribution</tspan><tspan x="782.5" dy="24">Pv = Gv × Bv × Ev</tspan></text><rect x="35" y="345" width="205" height="70" rx="9" fill="#fce4d6" stroke="#475569" stroke-width="1.5"/><text x="137.5" y="374" text-anchor="middle" font-size="18"><tspan x="137.5" dy="0">Flat carrier W</tspan><tspan x="137.5" dy="24">Deterministic support</tspan></text><rect x="345" y="455" width="255" height="70" rx="9" fill="#e4dfec" stroke="#475569" stroke-width="1.5"/><text x="472.5" y="484" text-anchor="middle" font-size="18"><tspan x="472.5" dy="0">Aperiodic WGMM + frame gain</tspan><tspan x="472.5" dy="24">Ec(f,t) and Gc(t)</tspan></text><rect x="345" y="345" width="255" height="70" rx="9" fill="#fce4d6" stroke="#475569" stroke-width="1.5"/><text x="472.5" y="374" text-anchor="middle" font-size="18"><tspan x="472.5" dy="0">Candidate aperiodic contribution</tspan><tspan x="472.5" dy="24">Apre = Gc × W × Ec</tspan></text><rect x="660" y="345" width="245" height="70" rx="9" fill="#fce4d6" stroke="#475569" stroke-width="1.5"/><text x="782.5" y="374" text-anchor="middle" font-size="18"><tspan x="782.5" dy="0">LAEA local calibration</tspan><tspan x="782.5" dy="24">Acal = exp(m × log Apre)</tspan></text><rect x="660" y="455" width="245" height="70" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="782.5" y="484" text-anchor="middle" font-size="18"><tspan x="782.5" dy="0">LR local log magnitude</tspan><tspan x="782.5" dy="24">conditions LAEA</tspan></text><rect x="980" y="75" width="220" height="70" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="1090" y="104" text-anchor="middle" font-size="18"><tspan x="1090" dy="0">Observed LR magnitude</tspan><tspan x="1090" dy="24">retained in output</tspan></text><ellipse cx="1080" cy="300" rx="30" ry="30" fill="#e2f0d9" stroke="#475569" stroke-width="1.5"/><text x="1080" y="306" text-anchor="middle" font-size="30"><tspan x="1080" dy="0">+</tspan></text><rect x="1180" y="255" width="230" height="90" rx="9" fill="#e2f0d9" stroke="#475569" stroke-width="1.5"/><text x="1295" y="294" text-anchor="middle" font-size="18"><tspan x="1295" dy="0">Reconstructed magnitude</tspan><tspan x="1295" dy="24">|LR| + Pv + Acal</tspan></text><text x="720" y="614" text-anchor="middle" font-size="17"><tspan x="720" dy="0">LAEA acts only on the assembled aperiodic log branch: u = log Apre; m = mask(u + log|LR|), 0 &lt; m &lt; 1.</tspan><tspan x="720" dy="24">This is exponent calibration, not linear-amplitude masking. WGMM weights still affect level; gain is not a unique scale coordinate.</tspan></text></g></svg>